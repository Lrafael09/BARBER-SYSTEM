name: Build Cloudflare Worker bundle

on:
  push:
    branches: [cloudflare-migration]
    paths:
      - "cloudflare/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-worker.yml"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build Worker
        run: npm run build
      - name: Commit deployment bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/worker.js
          if git diff --cached --quiet; then
            echo "Bundle unchanged."
            exit 0
          fi
          git commit -m "Build Cloudflare Worker bundle [skip ci]"
          git push origin cloudflare-migration
