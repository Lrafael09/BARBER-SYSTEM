<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010"><title>Área do profissional | {{ barbershop_name }}</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b0b0b;color:#f5f5f5}
*{box-sizing:border-box}body{margin:0;padding:26px 16px 50px}main{max-width:850px;margin:auto}
.brand{font-size:12px;letter-spacing:.16em;color:#a8f05a}h1{font-size:34px;margin:10px 0 5px}
p{color:#aaa;line-height:1.5}.card{background:#151515;border:1px solid #292929;border-radius:15px;padding:18px;margin:16px 0}
label{display:block;color:#bbb;font-size:13px;margin:12px 0 6px}
input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #3b3b3b;background:#0c0c0c;color:white;font:inherit}
button{background:#a8f05a;color:#111;border:0;font-weight:700;cursor:pointer;margin-top:12px}
button.secondary{background:#282828;color:#eee;border:1px solid #444}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{max-width:190px}
.item{border:1px solid #303030;border-radius:12px;padding:14px;margin:10px 0}
.meta{font-size:13px;color:#aaa}.status{font-size:12px;color:#a8f05a}
.actions{display:flex;gap:8px}.actions button{width:auto;flex:1}
.hidden{display:none}.message{color:#a8f05a;white-space:pre-wrap;margin-top:10px}
@media(max-width:540px){.actions{flex-direction:column}.actions button{width:100%}}
</style></head>
<body><main>
<div class="brand">BARBER-SYSTEM / PROFISSIONAL</div>
<h1>{{ barbershop_name }}</h1><p>Entre com seu identificador e PIN para consultar sua agenda.</p>
<section class="card" id="login-card">
<h2>Entrar</h2>
<label for="barber-id">Seu identificador</label><input id="barber-id" inputmode="numeric" placeholder="ID fornecido pelo proprietário">
<label for="pin">PIN de quatro números</label><input id="pin" inputmode="numeric" maxlength="4" type="password" autocomplete="current-password">
<button id="login">Acessar minha agenda</button><div id="login-message" class="message" role="status"></div>
</section>
<section class="hidden" id="agenda">
<div class="row"><div><h2 id="welcome">Minha agenda</h2><p>Você vê somente os atendimentos atribuídos à sua conta.</p></div><button class="secondary" id="logout" style="width:auto">Sair</button></div>
<section class="card">
<div class="filters"><input id="date" type="date"><button id="load" style="width:auto">Consultar</button><button id="today" class="secondary" style="width:auto">Hoje</button></div>
<div id="appointments"></div><div id="agenda-message" class="message"></div>
</section>
</section>
</main>
<script>
(() => {
const slug={{ barbershop_slug|tojson }};
const $=id=>document.getElementById(id);
let logged=false;
async function loadAppointments(){
 const params=new URLSearchParams();
 if($('date').value)params.set('date',$('date').value);
 const response=await fetch('/barber/appointments?'+params.toString());
 const data=await response.json();
 if(!response.ok)throw new Error(data.error||'Não foi possível carregar a agenda.');
 const root=$('appointments');root.replaceChildren();
 if(!data.appointments.length){$('agenda-message').textContent='Nenhum atendimento encontrado para essa data.';return;}
 $('agenda-message').textContent='';
 data.appointments.forEach(a=>{
  const card=document.createElement('article');card.className='item';
  const title=document.createElement('strong');title.textContent=a.customer_name+' — '+a.service_name;card.appendChild(title);
  const time=document.createElement('p');time.className='meta';time.textContent=a.starts_at.replace('T',' ').slice(0,16)+' até '+a.ends_at.slice(11,16)+' • '+a.duration_minutes+' min';card.appendChild(time);
  const status=document.createElement('div');status.className='status';status.textContent='Status: '+({scheduled:'Agendado',completed:'Concluído',cancelled:'Cancelado'}[a.status]||a.status);card.appendChild(status);
  if(a.status==='scheduled'){
   const actions=document.createElement('div');actions.className='actions';
   const done=document.createElement('button');done.textContent='Concluir atendimento';
   done.addEventListener('click',async()=>{const r=await fetch('/barber/appointments/'+a.id+'/complete',{method:'POST'});const d=await r.json();if(!r.ok){$('agenda-message').textContent=d.error||'Erro';return;}loadAppointments();});
   const cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='Cancelar';
   cancel.addEventListener('click',async()=>{const reason=prompt('Informe o motivo do cancelamento:');if(!reason)return;const r=await fetch('/barber/appointments/'+a.id+'/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});const d=await r.json();if(!r.ok){$('agenda-message').textContent=d.error||'Erro';return;}loadAppointments();});
   actions.append(done,cancel);card.appendChild(actions);
  }
  root.appendChild(card);
 });
}
$('login').addEventListener('click',async()=>{
 const id=Number($('barber-id').value),pin=$('pin').value;
 if(!Number.isInteger(id)||id<1||!/^\d{4}$/.test(pin)){$('login-message').textContent='Informe um ID válido e PIN com quatro números.';return;}
 try{
  const response=await fetch('/barber/'+encodeURIComponent(slug)+'/'+id+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Falha no login.');
  logged=true;$('login-card').classList.add('hidden');$('agenda').classList.remove('hidden');$('welcome').textContent='Olá, '+data.barber.name;
  $('date').value=new Date().toLocaleDateString('en-CA');await loadAppointments();
 }catch(error){$('login-message').textContent=error.message;}
});
$('load').addEventListener('click',()=>loadAppointments().catch(e=>$('agenda-message').textContent=e.message));
$('today').addEventListener('click',()=>{$('date').value=new Date().toLocaleDateString('en-CA');loadAppointments().catch(e=>$('agenda-message').textContent=e.message);});
$('logout').addEventListener('click',async()=>{await fetch('/barber/logout',{method:'POST'});logged=false;$('agenda').classList.add('hidden');$('login-card').classList.remove('hidden');$('pin').value='';});
})();
</script></body></html>
